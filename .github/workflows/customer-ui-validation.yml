name: Customer UI Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-ui-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Setup Python for booking contract validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Booking Contract Validator
        run: python -m pip install -r requirements-booking-contract.txt

      - name: Validate Canonical Booking v1 Contract
        run: python scripts/booking_contract_validator.py

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test
