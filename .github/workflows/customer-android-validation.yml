name: Customer Android Validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: customer-android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      # The repository currently omits the Gradle wrapper JAR and scripts.
      # Generate them in the runner only; do not overwrite or commit Android config.
      - name: Generate temporary Gradle wrapper
        working-directory: android
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > local.properties
          gradle wrapper --gradle-version 8.12

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Validate booking contract
        run: |
          python -m pip install -r requirements-booking-contract.txt
          python scripts/booking_contract_validator.py

      - name: Flutter analyze
        run: flutter analyze

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Verify APK artifact
        run: test -s build/app/outputs/flutter-apk/app-debug.apk
