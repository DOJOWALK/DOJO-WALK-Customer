name: Customer Flutter PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - '**.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: customer-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze Customer app (no release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Firebase configuration and app assets
        run: |
          test -s android/app/google-services.json
          test -s "assets/images/DOJO WALK SPLASH.png"
          test -s "assets/images/DOJO WALK APP ICON.png"

      - name: Analyze Flutter code
        run: flutter analyze

      - name: Run Flutter tests (required)
        shell: bash
        run: |
          test -n "$(find test -type f -name '*_test.dart' -print -quit)"
          flutter test
