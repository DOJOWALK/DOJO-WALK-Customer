name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check Required Secrets
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for item in MAPS_KEY KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!item}" ]; then
              echo "Required GitHub Actions secret is missing: $item"
              exit 1
            fi
          done
          echo "Required build and stable-signing secrets are configured."

      - name: Prepare Stable Android Signing Key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks
          echo "Stable signing keystore prepared on the runner."

      - name: Check Firebase Configuration
        run: test -s android/app/google-services.json

      - name: Check Required Images
        run: |
          test -s "assets/images/DOJO WALK SPLASH.png"
          test -s "assets/images/DOJO WALK APP ICON .png"
          echo "Splash and app icon images are present."

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Android App Icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Print APK Signing Certificate Fingerprints
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Dojo-Walk.apk

      - name: Check APK
        run: test -s build/app/outputs/flutter-apk/Dojo-Walk.apk

      - name: Remove Signing Key From Runner
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dojo-Walk
          path: build/app/outputs/flutter-apk/Dojo-Walk.apk
          if-no-files-found: error
          retention-days: 7
