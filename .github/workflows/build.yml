name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Check Google Maps Secret
        env:
          MAPS_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_KEY" ]; then
            echo "GOOGLE_MAPS_API_KEY secret is missing."
            exit 1
          fi
          echo "Google Maps API secret is configured."

      - name: Check Firebase Configuration
        run: test -f android/app/google-services.json

      - name: Check Required Images
        run: |
          test -s "assets/images/DOJO WALK SPLASH.png"
          test -s "assets/images/DOJO WALK APP ICON .png"
          echo "Splash and app icon images are present."

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate Android App Icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Dojo-Walk.apk

      - name: Check APK
        run: test -s build/app/outputs/flutter-apk/Dojo-Walk.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Dojo-Walk
          path: build/app/outputs/flutter-apk/Dojo-Walk.apk
          if-no-files-found: error
          retention-days: 7
