name: dojo_walk_customer
description: DOJO WALK customer app for easy and reliable dog walking.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.1
  firebase_auth: ^5.6.2
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.10

  # Image Picker
  image_picker: ^1.2.0

  # Google Maps and location
  google_maps_flutter: ^2.13.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Settings
  shared_preferences: ^2.5.3
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - "assets/images/DOJO WALK SPLASH.png"
    - "assets/images/DOJO WALK APP ICON .png"

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/DOJO WALK APP ICON .png"
  adaptive_icon_background: "#FFFAF5"
  adaptive_icon_foreground: "assets/images/DOJO WALK APP ICON .png"
